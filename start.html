<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/start.css" />
  
    <title>Quiz Game</title>
  </head>

  <body>
    <span id="loader"></span>
    <h3 id="error">something went wrong || try again </h3>

    <div class="container">
      <header class="header">
        <div>
          <p>Question No: </p>
          <span id="question-number">1</span>
        </div>
        <div>
          <p>Score:</p>
          <span id="score">0</span>
        </div>
      </header>
      <div id="question-box">
        <h3 id="question-text">question text</h3>
        <button class="answer-text">1</button>
        <button class="answer-text">2</button>
        <button class="answer-text">3</button>
        <button class="answer-text">4</button>
      </div>

      <button id="finish-button">Finish</button>
      <button id="next-button">Next</button>
    </div>

    <script src="js/app.js" type="module"></script>
    <script src="js/helper.js" type="module"></script>
  </body>
</html>
